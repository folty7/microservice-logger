# Production-style stack: built images, no bind mounts, no dev servers, nothing but the
# frontend published to the host. Run with:
#   docker compose -f docker-compose.prod.yaml up --build -d
services:
  react-frontend:
    build:
      context: react-frontend
      target: prod
    restart: always
    depends_on:
      sails-api:
        condition: service_healthy
    # nginx serves the built assets and proxies /api to the gateway
    ports:
      - 80:80
  sails-api:
    build: sails-api
    restart: always
    environment:
      PORT: 8080
      NODE_ENV: production
      FEATHERS_LOGS_URL: http://feathers-logs-service:8081
      FEATHERS_USERS_URL: http://feathers-users-service:8082
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      feathers-logs-service:
        condition: service_healthy
      feathers-users-service:
        condition: service_healthy
  feathers-logs-service:
    build: feathers-logs-service
    restart: always
    environment:
      PORT: 8081
      NODE_ENV: production
      MONGODB: mongodb://${MONGO_APP_USERNAME:?set MONGO_APP_USERNAME in .env}:${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD in .env}@mongo:27017/${MONGO_APP_DATABASE:?set MONGO_APP_DATABASE in .env}
      FEATHERS_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET in .env}
      # Optional: delete logs older than this many days (0 or unset keeps them forever)
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-0}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      mongo:
        condition: service_healthy
  feathers-users-service:
    build: feathers-users-service
    restart: always
    environment:
      PORT: 8082
      NODE_ENV: production
      MONGODB: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongo:27017/${MONGO_APP_DATABASE}
      FEATHERS_SECRET: ${APP_JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8082/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      mongo:
        condition: service_healthy
  mongo:
    image: mongo:8.0.10
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
      MONGO_APP_DATABASE: ${MONGO_APP_DATABASE}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Not published: the database is reachable only from the compose network

volumes:
  mongo-data:
