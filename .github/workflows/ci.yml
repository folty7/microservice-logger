name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [sails-api, feathers-logs-service, feathers-users-service]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: react-frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  audit:
    name: npm audit (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [sails-api, feathers-logs-service, feathers-users-service, react-frontend]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Fails the build on a new high or critical advisory in runtime dependencies
      - run: npm audit --omit=dev --audit-level=high

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate both compose files
        run: |
          cp .env.example .env
          # Placeholder secrets: config only interpolates, it does not start anything
          sed -i 's/^APP_JWT_SECRET=.*/APP_JWT_SECRET=ci-placeholder-secret-0123456789abcdef/' .env
          sed -i 's/^MONGO_ROOT_PASSWORD=.*/MONGO_ROOT_PASSWORD=ci-placeholder/' .env
          sed -i 's/^MONGO_APP_PASSWORD=.*/MONGO_APP_PASSWORD=ci-placeholder/' .env
          sed -i 's/^MONGO_EXPRESS_PASSWORD=.*/MONGO_EXPRESS_PASSWORD=ci-placeholder/' .env
          docker compose config -q
          docker compose -f docker-compose.prod.yaml config -q
