server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Single-page app: unknown paths are handled by the client-side router
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Same-origin API: /api/logs -> http://sails-api:8080/logs
  location /api/ {
    proxy_pass http://sails-api:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
